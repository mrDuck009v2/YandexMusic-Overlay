<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://*.yandex.net https://*.yandex.ru data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>YM Overlay</title>
<style>
  :root { --op: 0.7; --accent: #ffcc00; --acc: 255,204,0; --bg: 18,18,22; --bgp: 24,24,29; --fg: 255,255,255;
    --lyop: 0.7; --pop: 0.96; --lyfs: 16px; --rad: 14px; --blurf: blur(14px); --onacc: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif; color: rgb(var(--fg)); user-select: none; }

  /* пока панель закрыта, оверлей не реагирует на мышь вообще: без наведений, курсоров и уголка для ресайза */
  body:not(.open), body:not(.open) * { pointer-events: none !important; cursor: default !important; }
  body:not(.open) #lyw { resize: none; }

  /* ───────── Мини-плеер (HUD) ───────── */
  #hud { position: fixed; width: 330px; padding: 10px; display: flex; gap: 12px; align-items: center;
    background: rgba(var(--bg), var(--op)); border-radius: var(--rad); backdrop-filter: var(--blurf);
    transition: opacity .25s, transform .25s; overflow: hidden; z-index: 10; touch-action: none; }
  #hud.free { right: auto; bottom: auto; }
  #hud.dragging { transition: none; }
  #hud.hidden { opacity: 0; transform: translateY(-6px); }
  #hud.top-left { top: 20px; left: 20px; }
  #hud.top-right { top: 20px; right: 20px; }
  #hud.bottom-left { bottom: 20px; left: 20px; }
  #hud.bottom-right { bottom: 20px; right: 20px; }
  #hud .cover { width: 52px; height: 52px; border-radius: 8px; background: #333 center/cover; flex: none; }
  #hud .txt { min-width: 0; flex: 1; }
  #hud .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .l { margin-top: 3px; font-size: 12px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .l:empty { display: none; }
  #hud .a { font-size: 12px; color: rgba(var(--fg),.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width .5s linear; }
  #hud .state { font-size: 14px; flex: none; opacity: .8; display: flex; align-items: center; }
  #hud .state svg { width: 20px; height: 20px; }

  /* ───────── Панель (по хоткею) ───────── */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center;
    justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s; }
  body.open #backdrop { opacity: 1; pointer-events: auto; }
  body.open #hud, body.open #hud.hidden { opacity: 1; transform: none; cursor: grab;
    outline: 2px dashed rgba(var(--acc),.7); outline-offset: -2px; }
  body.open #hud.dragging { cursor: grabbing; }
  #panel { width: 600px; max-width: 92vw; background: rgba(var(--bgp), var(--pop)); border-radius: calc(var(--rad) + 4px); padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.97); transition: transform .18s; }
  body.open #panel { transform: scale(1); }
  .top { display: flex; gap: 18px; }
  .top .cover { width: 150px; height: 150px; border-radius: 12px; background: #333 center/cover; flex: none; }
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .info .t { font-size: 20px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .a { font-size: 14px; color: rgba(var(--fg),.7); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .al { font-size: 12px; color: rgba(var(--fg),.45); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .seek { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; font-size: 12px; color: rgba(var(--fg),.6); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px;
    background: rgba(var(--fg),.2); outline: none; flex: 1; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }

  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
  button { font: inherit; color: rgb(var(--fg)); background: rgba(var(--fg),.08); border: none; cursor: pointer;
    border-radius: 10px; padding: 8px 14px; font-size: 16px; transition: background .12s; }
  button:hover { background: rgba(var(--fg),.18); }
  button.active { color: var(--accent); background: rgba(var(--acc),.22); box-shadow: inset 0 0 0 1.5px var(--accent); }
  button { display: inline-flex; align-items: center; justify-content: center; }
  svg { fill: currentColor; flex: none; }
  .controls button svg { width: 22px; height: 22px; }
  button.big svg { width: 28px; height: 28px; }
  #vIcon { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; }
  #vIcon svg { width: 22px; height: 22px; }
  button.big { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--onacc); font-size: 22px; }
  button.big:hover { filter: brightness(1.12); }
  .vol { display: flex; align-items: center; gap: 8px; margin-left: 14px; width: 140px; }

  /* ───────── Вкладки: очередь / текст / поиск ───────── */
  #tabs { display: flex; gap: 8px; margin-top: 18px; }
  #tabs .tab { font-size: 12px; font-weight: 600; padding: 6px 14px; color: rgba(var(--fg),.7); }
  .pane { display: none; margin-top: 8px; height: 230px; overflow-y: auto; border-radius: 10px; background: rgba(var(--fg),.04); }
  .pane.show { display: block; }
  .pane::-webkit-scrollbar, #sres::-webkit-scrollbar, #pres::-webkit-scrollbar { width: 8px; }
  .pane::-webkit-scrollbar-thumb, #sres::-webkit-scrollbar-thumb, #pres::-webkit-scrollbar-thumb { background: rgba(var(--fg),.2); border-radius: 4px; }

  /* текст песни */
  #lyw { position: fixed; right: 20px; bottom: 20px; width: 380px; height: 340px; min-width: 240px; min-height: 150px;
    max-width: 95vw; max-height: 95vh; display: none; flex-direction: column; overflow: hidden; resize: both; z-index: 11;
    background: rgba(var(--bg), var(--lyop)); border-radius: var(--rad); backdrop-filter: var(--blurf); touch-action: none; }
  #lyw.show { display: flex; }
  #lyw.free { right: auto; bottom: auto; }
  body.open #lyw { outline: 2px dashed rgba(var(--acc),.7); outline-offset: -2px; }
  #lyHead { display: none; flex: none; align-items: center; gap: 6px; padding: 6px 8px 4px 12px; font-size: 12px; font-weight: 600;
    color: rgba(var(--fg),.55); cursor: grab; }
  body.open #lyHead { display: flex; }
  #lyHead.dragging { cursor: grabbing; }
  #lyHead .sp { flex: 1; }
  #lyHead button { padding: 3px 8px; font-size: 12px; }
  #lyrics { flex: 1; min-height: 0; overflow-y: auto; position: relative; text-align: center; }
  body:not(.open) #lyrics { overflow: hidden; }
  #lyrics::-webkit-scrollbar { width: 8px; }
  #lyrics::-webkit-scrollbar-thumb { background: rgba(var(--fg),.2); border-radius: 4px; }
  .ly { padding: 5px 8px; font-size: var(--lyfs); font-weight: 600; line-height: 1.3; color: rgba(var(--fg),.35); cursor: pointer; transition: color .25s, transform .25s; }
  .ly:hover { color: rgba(var(--fg),.65); }
  .ly.past { color: rgba(var(--fg),.22); }
  .ly.on { color: rgb(var(--fg)); transform: scale(1.06); }
  .lmsg { padding: 40px 16px; font-size: 13px; color: rgba(var(--fg),.5); }
  .lplain { padding: 12px 16px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; color: rgba(var(--fg),.82); }
  .lsrc { padding: 8px 0 2px; font-size: 11px; color: rgba(var(--fg),.3); }

  /* поиск */
  #searchPane.show, #plistPane.show { display: flex; flex-direction: column; }
  .srow { display: flex; gap: 8px; padding: 8px; }
  #sq, #pu { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: rgb(var(--fg)); background: rgba(var(--fg),.1); border: none; outline: none;
    border-radius: 8px; padding: 8px 12px; user-select: text; }
  #sq:focus, #pu:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  #sGo, #pAdd { font-size: 13px; padding: 8px 14px; }
  #sGo:disabled, #pAdd:disabled { opacity: .5; cursor: default; }
  #sstat, #pstat { padding: 0 12px 6px; font-size: 12px; color: rgba(var(--fg),.45); min-height: 18px; }
  #sres, #pres { flex: 1; overflow-y: auto; }
  #scats { display: flex; gap: 6px; padding: 0 12px 6px; flex-wrap: wrap; }
  #scats .cat { font-size: 12px; padding: 3px 10px; }
  .shead { display: flex; align-items: center; padding: 8px 12px 3px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: rgba(var(--fg),.45); }
  .shead button { margin-left: auto; font-size: 11px; padding: 2px 8px; text-transform: none; letter-spacing: 0; }
  .q .ab { flex: none; align-self: center; padding: 2px 8px; font-size: 12px; min-width: 0; }
  .q .ty { flex: none; font-size: 11px; color: rgba(var(--fg),.35); }
  .fbtn { display: flex; gap: 8px; }
  .hx.wide { width: 170px; }
  .st .dcs { flex: 1; font-size: 12px; color: rgba(var(--fg),.55); }

  /* список треков плейлиста — слева от панели */
  #tracks { position: fixed; left: 10px; top: 10px; width: 340px; height: 500px; display: none; flex-direction: column; padding: 14px 6px 8px;
    background: rgba(var(--bgp), var(--pop)); border-radius: calc(var(--rad) + 4px); box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden; }
  #tracks.show { display: flex; }
  .tkHead { display: flex; align-items: center; gap: 10px; padding: 0 8px 8px 8px; }
  .tkHead img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #333; flex: none; }
  .tkHead img[src=""], .tkHead img:not([src]) { display: none; }
  .tkTitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tkTitle b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tkTitle span { font-size: 12px; color: rgba(var(--fg),.5); }
  .tkBar { display: flex; gap: 8px; padding: 0 8px 6px; }
  #tkFilter { flex: 1; min-width: 0; font: inherit; font-size: 12px; color: rgb(var(--fg)); background: rgba(var(--fg),.1); border: none; outline: none;
    border-radius: 8px; padding: 6px 10px; user-select: text; }
  #tkFilter:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  #tkPlay { font-size: 12px; padding: 6px 12px; white-space: nowrap; }
  #tkStat { padding: 0 12px 4px; font-size: 12px; color: rgba(var(--fg),.45); min-height: 16px; }
  #tkList { flex: 1; min-height: 0; overflow-y: auto; }
  #tkList::-webkit-scrollbar { width: 8px; }
  #tkList::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
  .q .sc { width: 28px; height: 28px; border-radius: 5px; background: #333; flex: none; align-self: center; object-fit: cover; }
  .q.sr { align-items: center; }
  .q { display: flex; gap: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; align-items: baseline; }
  .q:hover { background: rgba(var(--fg),.08); }
  .q.cur { color: var(--accent); }
  .q .n { width: 26px; text-align: right; color: rgba(var(--fg),.4); flex: none; }
  .q .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .aa { color: rgba(var(--fg),.5); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: rgba(var(--fg),.4); }
  .foot button { font-size: 12px; padding: 6px 12px; }
  #notReady { display: none; margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(var(--acc),.12); color: rgb(var(--acc)); font-size: 13px; }

  /* ───────── Вкладка «Вид» ───────── */
  #stylePane.show { display: block; padding: 4px 0; }
  .st { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 12px; }
  .st .lb { width: 150px; flex: none; color: rgba(var(--fg),.7); }
  .st input[type=range] { flex: 1; min-width: 0; }
  .st .val { width: 40px; text-align: right; color: rgba(var(--fg),.5); flex: none; }
  .st .sws { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
  .sw { width: 18px; height: 18px; min-width: 0; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.55); }
  .sw:hover { background-blend-mode: normal; transform: scale(1.12); }
  .sw.on { box-shadow: 0 0 0 2px rgba(var(--bgp),1), 0 0 0 4px var(--accent); }
  .hx { width: 76px; flex: none; font: inherit; font-size: 12px; color: rgb(var(--fg)); background: rgba(var(--fg),.1); border: none; outline: none;
    border-radius: 6px; padding: 4px 8px; user-select: text; }
  .hx:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .st input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .st .rst { margin-left: auto; font-size: 12px; padding: 5px 12px; }
</style>
</head>
<body>

<div id="hud" class="top-right">
  <div class="cover" id="hCover"></div>
  <div class="txt">
    <div class="t" id="hTitle">Яндекс Музыка</div>
    <div class="a" id="hArtist">загрузка…</div>
    <div class="l" id="hLy"></div>
  </div>
  <div class="state" id="hState">▶</div>
  <div class="bar" id="hBar"></div>
</div>

<div id="lyw">
  <div id="lyHead">
    <span>Текст песни</span><span class="sp"></span>
    <button id="lyPin" title="Закрепить поверх окон">📌</button>
    <button id="lyClose" title="Скрыть">✕</button>
  </div>
  <div id="lyrics"></div>
</div>

<div id="backdrop">
  <div id="tracks">
    <div class="tkHead">
      <img id="tkCover" alt="">
      <div class="tkTitle"><b id="tkName"></b><span id="tkInfo"></span></div>
      <button id="tkClose" title="Закрыть список">✕</button>
    </div>
    <div class="tkBar">
      <button id="tkPlay" title="Включить плейлист с первого трека">▶ Играть с начала</button>
      <input id="tkFilter" type="text" placeholder="Фильтр по названию…" autocomplete="off" spellcheck="false">
    </div>
    <div id="tkStat"></div>
    <div id="tkList"></div>
  </div>
  <div id="panel">
    <div class="top">
      <div class="cover" id="pCover"></div>
      <div class="info">
        <div class="t" id="pTitle">—</div>
        <div class="a" id="pArtist"></div>
        <div class="al" id="pAlbum"></div>
      </div>
    </div>

    <div class="seek">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="1" value="0">
      <span id="tDur">0:00</span>
    </div>

    <div class="controls">
      <button id="bShuffle" title="Перемешать">🔀</button>
      <button id="bPrev" title="Назад">⏮</button>
      <button id="bPlay" class="big" title="Пауза / играть">▶</button>
      <button id="bNext" title="Дальше">⏭</button>
      <button id="bRepeat" title="Повтор">🔁</button>
      <button id="bLike" title="Нравится">♥</button>
      <div class="vol"><span id="vIcon">🔊</span> <input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
    </div>

    <div id="notReady">Плеер Яндекс Музыки ещё не готов. Нажми «Открыть Яндекс Музыку», войди в аккаунт и запусти любой трек.</div>

    <div id="tabs">
      <button class="tab active" data-tab="queue">Очередь</button>
      <button class="tab" id="bLyShow" title="Показать/скрыть плавающий текст песни">Текст</button>
      <button class="tab" data-tab="plist">Плейлисты</button>
      <button class="tab" data-tab="search">Поиск</button>
      <button class="tab" data-tab="style">Настройки</button>
    </div>
    <div id="queue" class="pane show"></div>
    <div id="stylePane" class="pane"></div>
    <div id="plistPane" class="pane">
      <div class="srow">
        <input id="pu" type="text" placeholder="Ссылка на плейлист, альбом или исполнителя…" autocomplete="off" spellcheck="false">
        <button id="pAdd">Добавить</button>
      </div>
      <div id="pstat"></div>
      <div id="pres"></div>
    </div>
    <div id="searchPane" class="pane">
      <div class="srow">
        <input id="sq" type="text" placeholder="Трек, исполнитель, альбом, плейлист…" autocomplete="off" spellcheck="false">
        <button id="sGo">Найти</button>
      </div>
      <div id="sstat"></div>
      <div id="scats"></div>
      <div id="sres"></div>
    </div>

    <div class="foot">
      <span id="hint">Esc — закрыть</span>
      <span class="fbtn">
        <button id="bReload" title="Заново загрузить сайт в скрытом окне — если нет интернета при старте или что-то не подгрузилось">↻ Перезапустить Я.Музыку</button>
        <button id="bOpen">Открыть Яндекс Музыку</button>
      </span>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  let state = { ready: false };
  let stateAt = performance.now(); // когда пришло последнее состояние — для плавной подсветки строк
  const icons = {}; // href -> { vb, html } — иконки из спрайта самого сайта
  let cfg = { hudCorner: 'top-right', hudOpacity: 0.7, hudVisible: true, hudFlash: true, hotkeyPanel: '', hudPos: null, playlists: [], discord: { enabled: false, clientId: '', button: true }, hudLyrics: true, lyricsOffset: 0, lyricsVisible: true, lyricsPinned: false, lyricsPos: null };
  let panelOpen = false, seeking = false, volDragging = false;
  let flashTimer = null, flashing = false, lastTrackKey = '';

  // ───────── иконки сайта ─────────
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const SVG_OK = new Set(['g', 'path', 'circle', 'rect', 'ellipse', 'line', 'polyline', 'polygon', 'defs', 'clippath', 'mask', 'lineargradient', 'radialgradient', 'stop', 'filter', 'fegaussianblur', 'feoffset', 'feblend', 'fecolormatrix', 'feflood', 'fecomposite', 'femerge', 'femergenode']);
  // У иконок сайта внутри часто есть <mask>/<clipPath> с одинаковыми id (a, b, mask0 …).
  // Когда несколько иконок лежат в одном документе, id сталкиваются и маска берётся от чужой иконки —
  // из-за этого «предыдущая/следующая» превращались в белые квадраты. Делаем id уникальными.
  let svgSeq = 0;
  function uniquifyIds(svg) {
    const prefix = 'ymi' + (++svgSeq) + '-';
    const ids = new Set();
    svg.querySelectorAll('[id]').forEach((el) => ids.add(el.getAttribute('id')));
    if (!ids.size) return;
    const fix = (v) => v.replace(/url\(\s*(['"]?)#([^)'"\s]+)\1\s*\)/g, (m, q, id) => (ids.has(id) ? 'url(#' + prefix + id + ')' : m));
    const all = [svg, ...svg.querySelectorAll('*')];
    for (const el of all) {
      if (el.hasAttribute('id') && ids.has(el.getAttribute('id'))) el.setAttribute('id', prefix + el.getAttribute('id'));
      for (const a of Array.from(el.attributes)) {
        if (a.value.includes('url(')) el.setAttribute(a.name, fix(a.value));
      }
    }
  }
  function buildSvg(def) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', def.vb);
    svg.setAttribute('aria-hidden', 'true');
    const doc = new DOMParser().parseFromString('<svg xmlns="' + SVG_NS + '">' + def.html + '</svg>', 'image/svg+xml');
    const copy = (src, dst) => {
      for (const n of src.children) {
        if (!SVG_OK.has(n.localName.toLowerCase())) continue;
        const el = document.createElementNS(SVG_NS, n.localName);
        for (const a of n.attributes) {
          if (/^on/i.test(a.name) || /href/i.test(a.name) || /^xmlns/i.test(a.name)) continue;
          try { el.setAttribute(a.name, a.value); } catch { /* пропускаем */ }
        }
        copy(n, el);
        dst.appendChild(el);
      }
    };
    copy(doc.documentElement, svg);
    uniquifyIds(svg);
    // У иконок сайта корень <svg> без заливки, а нужные фигуры имеют явный fill="currentColor";
    // служебные <rect> без fill (рамка иконки) на сайте поэтому невидимы. У нас же в CSS svg { fill: currentColor },
    // и такие прямоугольники превращались в белые квадраты — выключаем заливку по умолчанию.
    if (svg.querySelector('[fill]:not([fill="none"])')) svg.style.fill = 'none';
    return svg;
  }
  function setIcon(el, role, fallback) {
    const href = state.icons && state.icons[role];
    const def = href ? icons[href] : null;
    const key = def ? href : 'fb:' + fallback;

  function renderLyrics() {

  function scrollToLine(el, instant) {

  function tickLyrics(force) {

      let lo = 0, hi = L.length - 1;
      while (lo <= hi) { // последняя строка, время которой уже наступило

        if (L[mid].t <= p + 0.05) { idx = mid; lo = mid + 1; } else hi = mid - 1;

  const SW = {
    accent: ['#ffcc00', '#ff8a3d', '#ff5a5f', '#ff5cc8', '#a46bff', '#5b8cff', '#2dd4ff', '#3ddc84', '#ffffff'],
    bg: ['#121216', '#000000', '#1a2433', '#1b1b2f', '#0f1f1a', '#2a1220', '#f2f2f2', '#ffffff'],

  const hexToRgb = (h) => { const m = /^#([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null; const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const lum = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  const themeVal = (k) => (k === 'hudOpacity' ? cfg.hudOpacity : (cfg.theme && cfg.theme[k] != null ? cfg.theme[k] : DEF_THEME[k]));
  const nclamp = (v, a, b, d) => (Number.isFinite(Number(v)) ? Math.min(b, Math.max(a, Number(v))) : d);

  function applyTheme() {
    const t = { ...DEF_THEME, ...(cfg.theme || {}) };

    const btnRow = row('Кнопка «Найти в Яндекс Музыке»');
    const btnIn = document.createElement('input'); btnIn.type = 'checkbox';
    btnIn.addEventListener('change', () => window.ym.discordSet({ button: btnIn.checked }));
    btnRow.appendChild(btnIn);
    const stRow = row('Состояние');
    const dcs = document.createElement('span'); dcs.className = 'dcs'; stRow.appendChild(dcs);
    const DC_TEXT = {
      off: 'выключено', noid: 'не задан Application ID — впиши его в поле ниже (или в DEFAULT_DISCORD_CLIENT_ID в main.js)', connecting: 'подключаюсь к Discord…',
      nodiscord: 'Discord не запущен — подключусь, как только запустишь', error: 'ошибка',
    };
    const showDc = () => {
      const st = dcState || { state: 'off' };
      dcs.textContent = st.state === 'connected' ? 'подключено' + (st.text ? ' как ' + st.text : '') + ' — статус виден в профиле' : (st.text && st.state === 'error' ? st.text : DC_TEXT[st.state] || st.state);
    };
    dcShow = showDc;
    syncers.push(() => {
      dcOn.checked = !!dc().enabled;
      btnIn.checked = dc().button !== false;
      if (document.activeElement !== idIn) idIn.value = dc().clientId || '';
      showDc();
    });
    const rr = row('');
    const rb = document.createElement('button'); rb.className = 'rst'; rb.textContent = 'Сбросить вид';
    rb.onclick = () => { pendingApp = null; clearTimeout(appTimer); window.ym.setAppearance({ reset: true }); };
    rr.appendChild(rb);
    syncStyle();
  })();

  // ───────── общие строки: трек / альбом / исполнитель / плейлист ─────────
  const TYPE_RU = { track: 'Трек', album: 'Альбом', artist: 'Исполнитель', playlist: 'Плейлист', wave: 'Волна', other: 'Ссылка' };
  const isPinned = (url) => (cfg.playlists || []).some((p) => p.url === url);

  // opts: pin — кнопка «＋ добавить в оверлей», remove — кнопка «✕ убрать»; setStat — куда писать статус
  function entityRow(it, opts, setStat) {
    const row = document.createElement('div');
    row.className = 'q sr';
    if (it.cover) { const im = document.createElement('img'); im.className = 'sc'; im.src = it.cover; row.appendChild(im); }
    const t = document.createElement('span'); t.className = 'tt'; t.textContent = it.title;
    const a = document.createElement('span'); a.className = 'aa'; a.textContent = it.subtitle || '';
    row.append(t, a);
    if (!it.subtitle && it.type && it.type !== 'track') { const ty = document.createElement('span'); ty.className = 'ty'; ty.textContent = TYPE_RU[it.type] || ''; row.appendChild(ty); }
    const play = async () => {
      document.querySelectorAll('#sres .q, #pres .q').forEach((r) => r.classList.remove('cur'));
      row.classList.add('cur');
      setStat('Запускаю… (страница загружается, это пара секунд)');
      const r = await window.ym.playUrl(it.url);
      setStat(r && r.error ? 'Не получилось: ' + r.error : 'Играет: ' + it.title);
    };
    // альбом, исполнитель и плейлист: клик открывает слева список треков, ▶ — включает сразу
    const browsable = it.type === 'album' || it.type === 'artist' || it.type === 'playlist';
    if (browsable) {
      const pb = document.createElement('button'); pb.className = 'ab'; pb.textContent = '▶'; pb.title = 'Играть с начала';
      pb.onclick = (e) => { e.stopPropagation(); play(); };
      row.appendChild(pb);
    }
    if (opts.pin && it.type !== 'track') {
      const b = document.createElement('button'); b.className = 'ab';
      const mark = () => { const on = isPinned(it.url); b.textContent = on ? '✓' : '＋'; b.title = on ? 'Уже в оверлее' : 'Добавить в «Плейлисты» оверлея'; b.disabled = on; };
      mark();
      b.onclick = async (e) => {
        e.stopPropagation();
        b.disabled = true;
        const r = await window.ym.pinAdd({ url: it.url, title: it.title, cover: it.cover });
        setStat(r && r.error ? 'Не получилось: ' + r.error : 'Добавлено во вкладку «Плейлисты»: ' + it.title);
        mark();
        if (r && r.ok && browsable) openTracks(r.item || it);
      };
      row.appendChild(b);
    }
    if (opts.remove) {
      const b = document.createElement('button'); b.className = 'ab'; b.textContent = '✕'; b.title = 'Убрать из оверлея';
      b.onclick = (e) => { e.stopPropagation(); window.ym.pinRemove(it.url); };
      row.appendChild(b);
    }
    row.addEventListener('click', () => (browsable ? openTracks(it) : play()));
    return row;
  }
  const emptyMsg = (box, text) => { const d = document.createElement('div'); d.className = 'lmsg'; d.textContent = text; box.appendChild(d); };

  // ───────── список треков слева от панели ─────────
  let tk = { item: null, items: null };
  const tkSame = (t) => {
    const n = (v) => String(v || '').toLowerCase();
    const first = n(t.subtitle).split(',')[0].trim();
    return n(t.title) === n(state.title) && (!first || n(state.artist).includes(first));
  };
  function layoutTracks() {
    const r = $('panel').getBoundingClientRect(), t = $('tracks');
    const w = Math.min(340, Math.max(220, r.left - 24));
    t.style.width = w + 'px';
    t.style.height = Math.round(r.height) + 'px';
    t.style.top = Math.round(r.top) + 'px';
    t.style.left = Math.max(10, Math.round(r.left - w - 14)) + 'px';
  }
  window.addEventListener('resize', layoutTracks);
  function markNowPlaying() {
    if (!tk.items) return;
    const rows = $('tkList').children;
    for (let i = 0; i < rows.length; i++) {
      const t = rows[i]._t;
      if (t) rows[i].classList.toggle('cur', !!state.ready && !state.empty && tkSame(t));
    }
  }
  function renderTracks() {
    const box = $('tkList');
    box.textContent = '';
    if (!tk.items) return;
    const f = $('tkFilter').value.trim().toLowerCase();
    let shown = 0;
    tk.items.forEach((t, i) => {
      if (f && !(t.title + ' ' + t.subtitle).toLowerCase().includes(f)) return;
      shown++;
      const row = document.createElement('div');
      row.className = 'q sr';
      row._t = t;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
      const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = t.title;
      const aa = document.createElement('span'); aa.className = 'aa'; aa.textContent = t.subtitle || '';
      row.append(n, tt, aa);
      row.addEventListener('click', async () => {
        $('tkStat').textContent = 'Запускаю… (' + t.title + ')';
        const r = await window.ym.playTrack(tk.item.url, t.url);
        $('tkStat').textContent = r && r.error ? 'Не получилось: ' + r.error : 'Играет: ' + t.title;
      });
      box.appendChild(row);
    });
    if (!shown) emptyMsg(box, f ? 'По фильтру ничего нет' : 'Треки не нашлись');
    markNowPlaying();
  }
  async function openTracks(it) {
    tk = { item: it, items: null };
    $('tracks').classList.add('show');
    layoutTracks();
    $('tkName').textContent = it.title;
    $('tkInfo').textContent = (TYPE_RU[it.type] || '') + ' · загружаю треки…';
    $('tkCover').src = it.cover || '';
    $('tkFilter').value = '';
    $('tkStat').textContent = '';
    $('tkList').textContent = '';
    emptyMsg($('tkList'), 'Читаю список с сайта… (у длинных плейлистов это до 20 секунд)');
    let r;
    try { r = await window.ym.tracks(it.url); } catch (e) { r = { error: String((e && e.message) || e) }; }
    if (!tk.item || tk.item.url !== it.url) return; // тем временем открыли другой список
    if (!r || r.error) { $('tkInfo').textContent = TYPE_RU[it.type] || ''; $('tkList').textContent = ''; emptyMsg($('tkList'), 'Не получилось: ' + ((r && r.error) || 'нет ответа')); return; }
    tk.items = r.items || [];
    if (r.title && it.title === it.url) $('tkName').textContent = r.title;
    $('tkInfo').textContent = (TYPE_RU[it.type] || '') + ' · ' + tk.items.length + ' треков';
    renderTracks();
  }
  $('tkClose').onclick = () => { tk = { item: null, items: null }; $('tracks').classList.remove('show'); };
  $('tkPlay').onclick = async () => {
    if (!tk.item) return;
    $('tkStat').textContent = 'Запускаю…';
    const r = await window.ym.playUrl(tk.item.url);
    $('tkStat').textContent = r && r.error ? 'Не получилось: ' + r.error : 'Играет: ' + tk.item.title;
  };
  $('tkFilter').addEventListener('input', renderTracks);

  // ───────── плейлисты ─────────
  let myPl = null, plBusy = false; // myPl: null — ещё не грузили, иначе { items } или { error }
  const setPStat = (t) => { $('pstat').textContent = t || ''; };
  function renderPlaylists() {
    const box = $('pres');
    box.textContent = '';
    const head = (title, btn) => {
      const h = document.createElement('div'); h.className = 'shead'; h.textContent = title;
      if (btn) h.appendChild(btn);
      box.appendChild(h);
    };
    head('Добавленные');
    const pins = cfg.playlists || [];
    if (!pins.length) emptyMsg(box, 'Пока пусто. Вставь ссылку выше или нажми ＋ у результата поиска или у своего плейлиста.');
    pins.forEach((it) => box.appendChild(entityRow(it, { remove: true }, setPStat)));
    const rb = document.createElement('button'); rb.textContent = '↻ Обновить'; rb.disabled = plBusy;
    rb.onclick = () => loadMyPlaylists(true);
    head('Мои плейлисты (из коллекции)', rb);
    if (myPl === null || plBusy) emptyMsg(box, 'Читаю список с сайта…');
    else if (myPl.error) emptyMsg(box, 'Не получилось: ' + myPl.error);
    else if (!myPl.items.length) emptyMsg(box, 'Плейлисты в коллекции не нашлись. Добавь нужные по ссылке.');
    else myPl.items.forEach((it) => box.appendChild(entityRow(it, { pin: true }, setPStat)));
  }
  async function loadMyPlaylists(force) {
    if (plBusy) return;
    plBusy = true;
    renderPlaylists();
    try { myPl = await window.ym.myPlaylists(force); } catch (e) { myPl = { error: String((e && e.message) || e) }; }
    plBusy = false;
    renderPlaylists();
  }
  async function addByUrl() {
    const u = $('pu').value.trim();
    if (!u) return;
    $('pAdd').disabled = true;
    setPStat('Читаю ссылку…');
    const r = await window.ym.pinAdd({ url: u });
    $('pAdd').disabled = false;
    if (r && r.error) { setPStat('Не получилось: ' + r.error); return; }
    $('pu').value = '';
    setPStat(r && r.existed ? 'Эта ссылка уже добавлена' : 'Добавлено');
    if (r && r.item && ['album', 'artist', 'playlist'].includes(r.item.type)) openTracks(r.item);
  }
  $('pAdd').onclick = addByUrl;
  $('pu').addEventListener('keydown', (e) => { if (e.key === 'Enter') addByUrl(); });

  // ───────── поиск ─────────
  const CATS = [['track', 'Треки'], ['artist', 'Исполнители'], ['album', 'Альбомы'], ['playlist', 'Плейлисты']];
  let sBusy = false, sData = null, sCat = 'track';
  const setStat = (t) => { $('sstat').textContent = t || ''; };
  function renderSearch() {
    const bar = $('scats'), box = $('sres');
    bar.textContent = '';
    box.textContent = '';
    if (!sData) return;
    for (const [key, label] of CATS) {
      const b = document.createElement('button');
      b.className = 'tab cat' + (key === sCat ? ' active' : '');
      b.textContent = label + ' ' + (sData[key] || []).length;
      b.onclick = () => { sCat = key; renderSearch(); };
      bar.appendChild(b);
    }
    const items = sData[sCat] || [];
    if (!items.length) emptyMsg(box, 'В этой категории ничего не нашлось');
    items.forEach((it) => box.appendChild(entityRow(it, { pin: true }, setStat)));
  }
  async function doSearch() {
    const q = $('sq').value.trim();
    if (!q || sBusy) return;
    sBusy = true;
    $('sGo').disabled = true;
    sData = null;
    renderSearch();
    setStat('Ищем…');
    let res;
    try { res = await window.ym.search(q); } catch (e) { res = { error: String((e && e.message) || e) }; }
    sBusy = false;
    $('sGo').disabled = false;
    if (!res || res.error) { setStat('Не получилось: ' + ((res && res.error) || 'нет ответа')); return; }
    sData = res.items;
    const total = CATS.reduce((n, [k]) => n + (sData[k] || []).length, 0);
    if (!total) { setStat('Ничего не нашлось'); return; }
    sCat = (CATS.find(([k]) => (sData[k] || []).length) || CATS[0])[0];
    setStat('Клик — играть · ＋ — добавить альбом/плейлист/исполнителя в оверлей');
    renderSearch();
  }
  $('sGo').onclick = doSearch;
  $('sq').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  // ───────── панель ─────────
  function setPanel(open) {
    panelOpen = open;
    document.body.classList.toggle('open', open);
    updateLyw();
    if (open && tk.item) layoutTracks();
    if (open) {
      loadQueue();
      if (tab === 'search') $('sq').focus();
    }
  }

  // ───────── события от main ─────────
  window.ym.onState((s) => { state = s; stateAt = performance.now(); render(); tickLyrics(); markNowPlaying(); });
  window.ym.onLyrics((p) => { lyr = p || { status: 'idle' }; renderLyrics(); });
  window.ym.onPanel(setPanel);
  window.ym.onIcons((m) => { Object.assign(icons, m); render(); });
  window.ym.onHud((v) => { cfg.hudVisible = v; updateHudVisibility(); });
  window.ym.onConfig((c) => {
    if (pendingApp) { c = { ...c }; delete c.theme; delete c.hudOpacity; } // свои несохранённые правки вида не затираем
    cfg = { ...cfg, ...c };
    applyTheme();
    syncStyle();
    if (tab === 'plist') renderPlaylists();
    applyHudPos();
    updateLyw();
    $('hint').textContent = `Esc или ${cfg.hotkeyPanel} — закрыть · мини-плеер и окно текста можно перетащить`;
    updateHudVisibility();
  });

  // ───────── кнопки ─────────
  $('bPlay').onclick = () => window.ym.cmd('toggle');
  $('bPrev').onclick = () => window.ym.cmd('prev');
  $('bNext').onclick = () => window.ym.cmd('next');
  $('bLike').onclick = () => window.ym.cmd('like');
  $('bShuffle').onclick = () => window.ym.cmd('shuffle');
  $('bRepeat').onclick = () => window.ym.cmd('repeat');
  $('bOpen').onclick = () => window.ym.openYandex();
  $('bReload').onclick = () => {
    window.ym.reloadYm();
    $('bReload').textContent = '↻ Перезапускаю…';
    $('bReload').disabled = true;
    setTimeout(() => { $('bReload').textContent = '↻ Перезапустить Я.Музыку'; $('bReload').disabled = false; }, 4000);
  };

  const seekEl = $('seek');
  seekEl.addEventListener('pointerdown', () => { seeking = true; });
  seekEl.addEventListener('input', () => { $('tCur').textContent = fmt(seekEl.value); });
  seekEl.addEventListener('change', () => { window.ym.cmd('seek', seekEl.value); setTimeout(() => { seeking = false; }, 400); });
  seekEl.addEventListener('pointerup', () => setTimeout(() => { seeking = false; }, 400));

  const volEl = $('vol');
  volEl.addEventListener('pointerdown', () => { volDragging = true; });
  volEl.addEventListener('input', () => window.ym.cmd('volume', volEl.value));
  volEl.addEventListener('pointerup', () => setTimeout(() => { volDragging = false; }, 300));

  // клик по затемнению и Esc закрывают панель
  $('backdrop').addEventListener('mousedown', (e) => { if (e.target === $('backdrop')) window.ym.closePanel(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.ym.closePanel();
  });

  applyTheme();
  render();
</script>
</body>
</html>
